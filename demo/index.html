<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tramito-layout · BPMN layout compiler demo</title>
<meta name="description" content="Compile coordinate-free ELK-BPMN JSON into fully laid-out BPMN 2.0 XML, rendered live in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f5a524'/%3E%3Crect x='4.5' y='13.5' width='6' height='6' rx='1.2' fill='%230b0e14'/%3E%3Crect x='13.5' y='4.5' width='6' height='6' rx='1.2' fill='%230b0e14'/%3E%3Cpath d='M7.5 13.5V9.8h6' stroke='%230b0e14' stroke-width='2' fill='none'/%3E%3Cpath d='M11.8 8 13.9 9.8 11.8 11.6' stroke='%230b0e14' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/diagram-js.css">
<link rel="stylesheet" href="assets/bpmn-js.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="https://github.com/LcpMarvel/tramito-layout">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#f5a524"/><rect x="4.5" y="13.5" width="6" height="6" rx="1.2" fill="#0b0e14"/><rect x="13.5" y="4.5" width="6" height="6" rx="1.2" fill="#0b0e14"/><path d="M7.5 13.5V9.8h6" stroke="#0b0e14" stroke-width="2" fill="none"/><path d="M11.8 8 13.9 9.8 11.8 11.6" stroke="#0b0e14" stroke-width="2" fill="none"/></svg>
    <span class="brand-text">
      <strong>tramito-layout</strong>
      <small>ELK-BPMN JSON → laid-out BPMN 2.0 XML, compiled in your browser</small>
    </span>
  </a>
  <nav class="topnav">
    <a href="https://github.com/LcpMarvel/tramito-layout">GitHub</a>
    <a href="https://www.npmjs.com/package/tramito-layout">npm</a>
    <a href="https://github.com/LcpMarvel/tramito-layout/blob/master/README.zh-CN.md">中文文档</a>
  </nav>
</header>

<main class="panes">
  <section class="pane editor-pane">
    <div class="pane-head">
      <label class="field-label" for="fixture">fixture</label>
      <select id="fixture" class="select"></select>
      <button id="compile" class="btn primary" title="Ctrl/Cmd + Enter">Compile</button>
    </div>
    <textarea id="source" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off" aria-label="ELK-BPMN JSON source"></textarea>
    <div id="statusline" class="statusline"></div>
  </section>

  <section class="pane result-pane">
    <div class="pane-head">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="diagram" role="tab">Diagram</button>
        <button class="tab" data-tab="xml" role="tab">BPMN XML</button>
      </div>
      <button id="download" class="btn" disabled>Download .bpmn</button>
    </div>
    <div id="diagram-card" class="canvas-card">
      <div id="canvas"></div>
      <div id="canvas-empty" class="canvas-empty">compile a fixture to see the diagram</div>
    </div>
    <pre id="xml" class="xml-view" hidden></pre>
    <section id="diagnostics" class="diagnostics" aria-live="polite"></section>
  </section>
</main>

<footer class="foot">
  <span id="pkg-meta"></span>
  <span>Apache-2.0 · diagrams rendered by <a href="https://bpmn.io/toolkit/bpmn-js/">bpmn-js</a> · placement by <a href="https://www.eclipse.org/elk/">Eclipse ELK</a></span>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
